# ============================================================
# [P0] Nginx 反向代理模板：SSL 终止 + 静态长缓存 + 登录限流
#
# 部署：替换 server_name 与证书路径后
#   cp deploy/nginx.conf /etc/nginx/conf.d/oa-reimbursement.conf && nginx -s reload
#
# 说明：
#   - iOS PWA（添加到主屏幕 / Service Worker）强制要求 HTTPS
#   - HTTP 一律 301 → HTTPS；HSTS 由应用层按 X-Forwarded-Proto 下发
#   - /login 与 /api/auth/login 叠加 Nginx 层限流（应用层还有账号级锁定）
# ============================================================

# 登录接口限流：每 IP 10 次/分钟，突发 5
limit_req_zone $binary_remote_addr zone=oa_login:10m rate=10r/m;

upstream oa_app {
    # 单实例；多实例横向扩展时在此追加 server 行
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name oa.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name oa.example.com;

    ssl_certificate     /etc/nginx/ssl/oa.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/oa.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 12m;   # 与应用层 10MB 上限对齐（留 header 余量）

    # ── 静态资源：Nginx 直出 + 长缓存（URL 带 ?v=APP_VERSION 缓存破坏）──
    location /static/ {
        alias /opt/oa-reimbursement/web/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Service Worker / Manifest：禁止缓存（保证 PWA 及时更新）──
    location = /m/sw.js {
        proxy_pass http://oa_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    # ── 登录接口：Nginx 层 IP 限流 ──
    location ~ ^/(login|api/auth/login)$ {
        limit_req zone=oa_login burst=5 nodelay;
        proxy_pass http://oa_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 健康检查（供 LB 探活，不写访问日志）──
    location = /healthz {
        proxy_pass http://oa_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── 应用主体 ──
    location / {
        proxy_pass http://oa_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI 校验链路耗时较长
    }
}
